app = "lgpd-sentinel-ai"
primary_region = "gru"  # São Paulo, Brazil

[build]

[env]
  PORT = "8000"
  LLM_PROVIDER = "grok"
  GROK_MODEL = "grok-3-mini-fast"
  LOG_LEVEL = "INFO"
  DEBUG = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/health"
